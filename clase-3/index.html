<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ingreso al evento</title>
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css" rel="stylesheet">
  <!--CDN → Content Delivery Network -->
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <nav class="indigo darken-2">
    <div class="nav-wrapper container">
      <span class="brand-logo">Frontend II</span>
    </div>
  </nav>

  <main class="container">
    <section class="card-panel z-depth-2">
      <h1 class="flow-text">Ingreso al evento</h1>
      <p>Ingresá tus datos para verificar si podés acceder.</p>

      <div class="input-field">
        <i class="material-icons prefix">person</i>
        <input id="nombre" type="text">
        <label for="nombre">Nombre</label>
      </div>

      <div class="input-field">
        <i class="material-icons prefix">cake</i>
        <input id="edad" type="number" min="1">
        <label for="edad">Edad</label>
      </div>

      <button id="verificar" class="btn waves-effect waves-light indigo darken-2">
        Verificar ingreso
        <i class="material-icons right">check</i>
      </button>

      <div id="resultado" class="resultado" aria-live="polite">
        El resultado aparecerá aquí.
      </div>
    </section>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
