<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recomendador de libros</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <h1 class="center-align">Recomendador de libros</h1>
    <div class="row">
      <div class="col s12 m8 offset-m2">
        <div class="card">
          <div class="card-content">
            <span class="card-title">¿Qué te gustaría leer?</span>

            <div class="input-field">
              <input id="nombre" type="text">
              <label for="nombre">Nombre</label>
            </div>

            <div class="input-field">
              <input id="edad" type="number">
              <label for="edad">Edad</label>
            </div>

            <div class="input-field">
              <select id="genero">
                <option value="" disabled selected>Elegí un género</option>
                <option value="ciencia-ficcion">Ciencia ficción</option>
                <option value="misterio">Misterio</option>
                <option value="fantasia">Fantasía</option>
              </select>
              <label>Género</label>
            </div>

            <p>
              <label>
                <input id="libroCorto" type="checkbox">
                <span>Prefiero un libro corto</span>
              </label>
            </p>

            <br>

            <button id="botonRecomendar" class="btn waves-effect waves-light">
              Recomendar libro
            </button>
          </div>
        </div>

        <div id="resultado" class="card oculto">
          <div class="card-content">
            <span id="tituloResultado" class="card-title"></span>
            <p id="mensajeResultado"></p>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
